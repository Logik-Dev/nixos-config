
- id: '1768941404192'
  alias: Série téléchargée
  description: Prévenir qu'une nouvelle série est arrivée
  triggers:
  - trigger: webhook
    allowed_methods:
    - POST
    - PUT
    local_only: false
    webhook_id: serie-downloaded
  conditions:
  - condition: device
    device_id: a3453d586ba92710007c49e13d8dc47b
    domain: device_tracker
    entity_id: 34c56a21a48bf50a458378ddec377c95
    type: is_home
  - condition: time
    after: 07:00:00
    before: '22:00:00'
  actions:
  - action: script.notifier
    metadata: {}
    data:
      message: Nouvel épisode de {{ trigger.json.series.title }} téléchargé !
      title: Nouvel épisode téléchargé
  mode: single
- id: '1771021457543'
  alias: Mouvement dans la chambre des enfants
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - switch.camera_lea_motion_detection
  conditions: []
  actions:
  - action: notify.mobile_app_macbookpro
    metadata: {}
    data:
