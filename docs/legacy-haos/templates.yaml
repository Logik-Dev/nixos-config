
- triggers:
    - trigger: time_pattern
      hours: /1
  actions:
    - action: mealie.get_mealplan
      data:
        config_entry_id: 01KQ4QXVQ180JWA6XWW8KY1W9N
      response_variable: result
  sensor:
    - name: "Mealie déjeuner aujourd'hui"
      unique_id: mealie_lunch_today
      state: >
        {% for meal in result.mealplan if meal.entry_type == "lunch" -%}
          {{ meal.recipe['name'] if meal.recipe is not none else meal.title -}}
          {{ ", " if not loop.last }}
        {%- endfor %}

    - name: "Mealie dîner aujourd'hui"
      unique_id: mealie_dinner_today
      state: >
        {% for meal in result.mealplan if meal.entry_type == "dinner" -%}
          {{ meal.recipe['name'] if meal.recipe is not none else meal.title -}}
          {{ ", " if not loop.last }}
        {%- endfor %}
  - binary_sensor:
    - name: "Il va pleuvoir"
      state: >
        {{ states("sensor.meteo_france_forecast_for_city_leognan_aquitaine_33_fr_leognan_daily_precipitation") | float(0) > 2 
        and states("sensor.meteo_france_forecast_for_city_leognan_aquitaine_33_fr_leognan_rain_chance") | float(0) > 30 }}
